[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netwatch"
version = "0.1.0"
description = "Network Health Monitor with distributed leader election and real-time dashboard"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "NetWatch Engineering" }
]
dependencies = [
    "dnspython>=2.6.1",
    "httpx>=0.27.0",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.2.1",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pyyaml>=6.0.1",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "coverage>=7.5.3",
    "ruff>=0.4.8",
]

[project.scripts]
netwatch = "netwatch.cli:app"

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["netwatch"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70.0
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
