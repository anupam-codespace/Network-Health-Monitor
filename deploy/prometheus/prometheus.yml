global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "netwatch"
    metrics_path: "/metrics"
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets:
          - "replica-1:8001"
          - "replica-2:8002"
        labels:
          service: "netwatch-cluster"
